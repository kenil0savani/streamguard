version: 2

models:
  - name: stg_raw_events
    description: Cleaned IoT telemetry events with ground truth labels.
    columns:
      - name: raw_event_id
        tests: [unique, not_null]
      - name: sensor_id
        tests: [not_null]
      - name: event_time
        tests: [not_null]
      - name: temperature
        tests: [not_null]
      - name: vibration
        tests: [not_null]

  - name: stg_scored_events
    description: Anomaly scores produced by the streaming IsolationForest consumer.
    columns:
      - name: scored_event_id
        tests: [unique, not_null]
      - name: sensor_id
        tests: [not_null]
      - name: event_time
        tests: [not_null]
      - name: anomaly_score
        tests: [not_null]
      - name: is_anomaly
        tests: [not_null]
        